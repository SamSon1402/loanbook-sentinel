global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: loanbook-sentinel-dev

scrape_configs:
  - job_name: sentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: sentinel
          env: dev

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
