[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loanbook-sentinel"
version = "0.3.1"
description = "Real-time loan portfolio health & anomaly detection for GCC SME lending"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sam", email = "sam@example.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "onnxruntime>=1.19.2",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "skl2onnx>=1.17.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "python-ulid>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-dateutil",
]

[project.scripts]
sentinel = "sentinel.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# Allow:
# E501  - long lines handled by formatter
# B008  - FastAPI uses Depends()/Query() as defaults
# N806  - sklearn convention `X`, SQLAlchemy convention `SessionLocal`
# UP042 - str+Enum inheritance is wanted for JSON serialization
# SIM105/117 - stylistic, occasionally less readable
# RUF001/002 - we use × intentionally in docs
ignore = ["E501", "B008", "N806", "UP042", "SIM105", "SIM117", "RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["skl2onnx.*", "onnxruntime.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
