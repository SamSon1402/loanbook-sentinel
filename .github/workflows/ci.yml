name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-typecheck:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: mypy
        run: mypy src

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest with coverage
        run: pytest --cov=src/sentinel --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  bootstrap-and-smoke:
    name: bootstrap + smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: generate small synthetic set
        run: |
          SENTINEL_SEED=1 python -c "
          from scripts.generate_synthetic_data import main
          main(n_loans=200)
          "
      - name: train + export ONNX
        run: python scripts/train_anomaly_model.py
      - name: seed DB + start API + curl /ready
        run: |
          python scripts/seed_db.py
          uvicorn sentinel.main:app --host 0.0.0.0 --port 8000 &
          sleep 6
          curl -fsS http://localhost:8000/ready
          curl -fsS http://localhost:8000/v1/portfolio/health | jq .

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: loanbook-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-validate:
    name: validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: kubeval
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas k8s/
